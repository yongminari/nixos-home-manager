"$schema" = 'https://starship.rs/config-schema.json'

# Zellij의 Everforest에 맞춘 차분한 색상과 화살표 구분자.
palette = "everforest"

format = """
[  LOCAL ](fg:ink bg:accent)\
$hostname\
[](fg:accent bg:directory_bg)\
$directory\
[](fg:directory_bg bg:git_bg)\
$git_branch\
$git_status\
[](fg:git_bg bg:runtime_bg)\
$nodejs\
$rust\
$golang\
$php\
[](fg:runtime_bg bg:time_bg)\
$time\
[ ](fg:time_bg)\
\n$character"""

[palettes.everforest]
accent = "#a7c080"
secondary = "#83c092"
ink = "#2d353b"
text = "#d3c6aa"
muted = "#9da9a0"
directory_bg = "#3a4942"
git_bg = "#343f44"
runtime_bg = "#2d353b"
time_bg = "#272e33"
error = "#e67e80"

[hostname]
ssh_only = false
trim_at = ""
style = "fg:ink bg:accent"
format = '[$hostname ]($style)'

[directory]
style = "fg:text bg:directory_bg"
format = "[ $path ]($style)"
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "fg:secondary bg:git_bg"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:secondary bg:git_bg"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "fg:secondary bg:runtime_bg"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:secondary bg:runtime_bg"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "fg:secondary bg:runtime_bg"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = ""
style = "fg:secondary bg:runtime_bg"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:muted bg:time_bg"
format = '[  $time ]($style)'

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](error)"
vimcmd_symbol = "[❮](secondary)"
