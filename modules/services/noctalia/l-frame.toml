# Noctalia v5 L-frame preset
# Keep both bars visible on empty workspaces and hide them intelligently when windows overlap.
# Float both bars with a small gap at the corner; panels float independently.

[shell.panel]
control_center_placement = "floating"
session_placement = "floating"
wallpaper_placement = "floating"
wallpaper_position = "center"
transparency_mode = "glass"

[bar]
order = ["top", "left"]

[bar.top]
position = "top"
thickness = 40
background_opacity = 0.88
radius = 14
margin_ends = 60
margin_edge = 8
padding = 8
widget_spacing = 6
shadow = true
auto_hide = false
smart_auto_hide = true
reserve_space = false
capsule = true
capsule_fill = "surface_variant"
capsule_radius = 12.0
capsule_opacity = 0.72
start = ["media"]
center = ["clock"]
end = [
  "tray",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
]

[bar.left]
position = "left"
thickness = 44
background_opacity = 0.88
radius = 14
margin_ends = 56
margin_edge = 8
padding = 6
widget_spacing = 8
shadow = true
auto_hide = false
smart_auto_hide = true
reserve_space = false
capsule = true
capsule_fill = "surface_variant"
capsule_radius = 12.0
capsule_opacity = 0.72
start = ["launcher", "wallpaper"]
center = ["workspaces"]
end = [
  "notifications",
  "clipboard",
  "control-center",
  "session",
]
